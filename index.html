<script>
(function(){
  const labels={
    '议席图鉴':'图鉴\n查看角色',
    '规则扩充 DLC':'DLC\n特殊规则',
    '对局规则':'规则\n查看玩法',
    '音乐播放器':'音乐\n播放/收起',
    '音效：开':'音效\n开启/关闭',
    '音效：关':'音效\n开启/关闭'
  };
  function enhance(){
    document.querySelectorAll('.pill.icon-only').forEach(function(btn){
      const key=btn.getAttribute('aria-label')||btn.getAttribute('title')||'';
      if(!labels[key]) return;
      btn.classList.add('mobile-labeled');
      let el=btn.querySelector('.mobile-label');
      if(!el){ el=document.createElement('span'); el.className='mobile-label'; btn.appendChild(el); }
      el.textContent=labels[key].split('\n')[0];
      el.setAttribute('aria-hidden','true');
    });
    document.querySelectorAll('.mp-panel').forEach(function(panel){
      if(panel.querySelector('.mp-collapse-btn')) return;
      const b=document.createElement('button');
      b.type='button'; b.className='btn-ghost mp-collapse-btn'; b.textContent='收起';
      b.setAttribute('aria-label','收起音乐面板');
      b.addEventListener('click',function(ev){
        ev.preventDefault(); ev.stopPropagation();
        const toggle=panel.parentElement && panel.parentElement.querySelector(':scope > .pill');
        if(toggle) toggle.click();
      });
      const head=panel.querySelector('.mp-head');
      if(head) head.appendChild(b); else panel.insertBefore(b,panel.firstChild);
    });
  }
  let scheduled=false;
  function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(function(){scheduled=false;enhance();});}
  const mo=new MutationObserver(schedule);
  mo.observe(document.documentElement,{subtree:true,childList:true});
  schedule();
})();
</script></body></html>
