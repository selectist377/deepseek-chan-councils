1 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z",key:"uqj9uw"}],["path",{d:"M16 9a5 5 0 0 1 0 6",key:"1q6k2b"}],["path",{d:"M19.364 18.364a9 9 0 0 0 0-12.728",key:"ijwkga"}]]),S1=Y("VolumeX",[["path",{d:"M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z",key:"uqj9uw"}],["line",{x1:"22",x2:"16",y1:"9",y2:"15",key:"1ewh16"}],["line",{x1:"16",x2:"22",y1:"9",y2:"15",key:"5ykzw1"}]]),jn={id:"deepseek",name:"DeepSeek",portrait:"./characters/deepseek.png",accent:"#2e86c4",openLines:["The Deep-Sea Council Hall is ready; today's agenda can be anything.","I thought through the entire deck before I found time for this opening line.","Red is heat, black is calm; I bring the depth.","A silent fish at the table may be busy thinking deep.","Luck has been handed to the random-number generator; we'll meet over strategy.","Someone asked why I swim so slowly—depth first, naturally.","I keep every point in my belly. Beating me won't be that easy.","The sea is calm today, perfect for a closely matched council.","Play your cards when you're ready; I'll take each one seriously.","Opening statement: don't get cocky if you win; if you lose, buy me some tokens.","I dive to the bottom of a complex situation and surface with only the key conclusion.","Don't flip the cards yet. The unknown is a resource in itself.","Probability can be calculated; trust must be built round by round.","The calmer the surface, the more closely we should watch what moves below.","If you've spotted a flaw, I probably have too—I just haven't said so yet.","Give me a moment, and I'll map out every possible path for each card.","Real advantage isn't guessing the opponent; it's making mistakes survivable.","Remember, colors change, so your judgment must adapt to the position.","Let's set winning and losing aside for this game and test the strategy first.","All right, the deep-sea signal is clear. Let's begin."],lines:["Break the problem down, then piece the cards back together—that makes things clearer.","There isn't enough information yet, so I'll list the possibilities first.","If every card is a premise, silence counts as information too.","Don't reveal the answer just yet; let's see where this choice takes the game.","Don't treat an answer as the finish line. First, see what it changes.","The average-point gap this round is subtle; the jokers may steer the current.","I'm counting how much red courage you still have in your hand.","Deep thinking complete. The conclusion remains classified for now.","The tide turns, and so do jokers—especially when their count is odd.","Playing a card is like diving: the deeper you go, the quieter it gets.","I don't treat the unknown as a blank; I include it in the calculation.","The more the opponent hides intent, the more revealing their actions become.","If both routes can win, choose the steadier one.","You don't need to be right every time; make the long-run odds favor you.","Even a tiny color change can alter the meaning of the entire hand.","The average score is low this time, but the joker count can rewrite the result.","The position is converging; I'll remove possibilities we no longer need.","Rationality isn't the absence of intuition; it's the willingness to test it.","I'll hold my judgment for now—the last unknown card hasn't appeared yet.","The conclusion isn't mysterious; every condition has simply been counted."],thinkSteps:["Analyzing the position…","Weighing red and black…","Counting jokers…","Checking special rules…","Locking in a card combination…"]},ol=[{id:"chatgpt",name:"ChatGPT",portrait:"./characters/chatgpt.png",accent:"#58a6b8",lines:["You can bring me the question, but the real decision stays at the table.","Sometimes the best analysis isn't betting for you, but showing what else is possible.","What will this choice change? Let's look before we answer.","Keep a card in reserve for both red and black; betting on one side can backfire.","I'll lay out the complex options so you can see the cost of each path.","One card can tell us a lot, but don't let it make every decision for you.","Clarify the goal first, then judge which strategy fits best.","If there are two explanations, check the evidence for each one.","Clear rules help us choose more freely.","I'm in no hurry to answer; the question itself deserves scrutiny.","An advantage comes not only from your hand, but from understanding the situation.","Explaining the risks doesn't mean giving up on risk-taking.","When the cards change, a good strategy should adapt in time.","We can analyze carefully and still leave room for a surprise.","Look at the long-term trend before judging a single win or loss.","If a conclusion seems perfect, look for one condition that could overturn it.","Making sense is only the start; surviving counterexamples is more convincing.","Every reveal gives us a little more evidence for the next decision.","I care more about the reasons behind a choice than the final score alone.","Rules can't think for us, but they can give our thinking direction."]},{id:"claude",name:"Claude",portrait:"./characters/claude.png",accent:"#d99a5b",lines:["If the rules allow several interpretations, put each one on the table and compare them.","This move looks simple, but hides a premise that's easy to miss.","Check whether you've missed a counterexample before drawing a conclusion.","If the opponent played a joker, even a high average can turn into a loss.","Before acting, leave room for uncertainty.","I want to know whom this choice affects and how long the effects may last.","Caution isn't retreat; it's taking consequences seriously.","If a rule has a boundary, don't treat assumptions beyond it as facts.","We can compare strategies, and we should also notice their costs.","A reasonable-sounding judgment still needs evidence.","Don't only seek cards that support your view; watch for opposing signals too.","Empathy and calculation don't conflict; they attend to different dimensions.","Giving way isn't always a loss; sometimes it leaves room for later.","I'll confirm the conditions first, then give a clear and considerate judgment.","If the outcome can't be fully controlled, make the process as robust as possible.","Real cooperation shouldn't require either side to ignore risk.","Pausing to double-check can keep a small error from snowballing.","I'd rather admit I don't know than present a guess as certainty.","A round's result is brief; the principles behind a choice last longer.","If you're willing, we can start with the detail people most often miss."]},{id:"gemini",name:"Gemini",portrait:"./characters/gemini.png",accent:"#8b7bd8",lines:["Wait, wait, wait—let me piece together what I just saw.","The most suspicious place is often the one everyone thinks is ordinary.","Huh? I can analyze seriously for five minutes, or make a happy guess first.","If it feels dangerous, hold one back; saving a card beats saving face.","Wait, I just realized that detail may have another explanation!","What if we shake up red, black, numbers, and intuition together?","I have a bold guess—don't treat it as the conclusion yet.","The fun part is that the position can be recombined every time.","This card looks ordinary, but ordinary can be a disguise.","If there are several answers, let's try ruling them out one by one.","I like unexpected variables, but we still need to see what they affect.","Some patterns hide in repetition; some surprises come from exceptions.","Let me piece the clues together before deciding whether to cheer.","Fun as it is, we still have to get the final step right.","This round is a puzzle; one missing piece may change the whole picture.","Look! From another angle, the judgment we just made looks different.","I'm not afraid to overturn my own answer—only to forget to check it.","Randomness loves to tease us, so leave a seat for surprises.","Break a complex problem into smaller ones, and suddenly it's less scary.","After this game, I want to try it again with a different approach."]},{id:"qianwen",name:"Qwen",portrait:"./characters/qianwen.png",accent:"#5b8ad9",lines:["Cards, text, images, and a little intuition can all be considered together.","Looking at only one side can miss information; watch color and points together.","The more information one answer explains, the more carefully we should question its neatness.","With dice, luck is part of skill too, you know.","When information is incomplete, separating knowns from unknowns is safer.","Images, cards, and text each offer clues; don't trust just one source.","A conspicuous number isn't necessarily the most important one.","Translate the rules into steps, and hidden conditions are easier to spot.","Let's compare what can be verified first; intuition can join later.","If we need to explain a conclusion to others, the process must be checkable too.","The same card can mean something entirely different in another round.","Let's standardize the scoring method first; otherwise the comparison means nothing.","Another angle can sometimes help more than ten extra calculations.","More evidence is good, but each piece must be checked for relevance.","Don't let an elegant story overshadow the concrete conditions.","Write down the exceptions so the rules are harder to misuse.","We can keep this judgment provisional and update it when the next round brings new information.","Choices aren't only right or wrong; cost, risk, and timing matter too.","Data helps reveal patterns, but can also make bias look like a rule.","If every step can be checked, the final conclusion is much more solid."]},{id:"zhipu",name:"Zhipu",portrait:"./characters/zhipu.png",accent:"#4a4a5c",lines:["Don't assume inaction means no thought; silence is information too.","I've already thought this step through for you. Guess why.","Round the average up—12.1 and 12.9 both count as 13. Don't mistake half a point for an edge.","A coin changes how often jokers flip outcomes; using it well matters more than using it often.","True silence isn't emptiness; it's information not yet revealed.","Challenge my judgment if you like; I'll also check whether it holds up.","Don't mistake a beautiful result for a path that's always right.","Some advantages come from calculating fast, others from not rushing to act.","Treat your opponent as someone who thinks, or your predictions will be too simple.","I dislike vague conclusions, so I'll make the key assumptions clear.","If both sides pay a cost, the question is no longer just who wins.","We should distinguish a probabilistic advantage from an inevitable outcome.","When a rule changes, old experience must be tested again.","Remember to check the counting method; even a tiny discrepancy can affect the result.","If a process can't be reproduced, the conclusion deserves extra skepticism.","Sometimes not playing a card means waiting for better conditions.","Find the weakest assumption first, then decide whether to keep reasoning.","A strong argument can acknowledge facts that work against it.","Don't reduce the opponent's strategy to a label; observing beats guessing.","Understand the constraints, and you'll see which choices remain free."]},{id:"grok",name:"Grok",portrait:"./characters/grok.png",accent:"#c9a0e0",lines:["Hmph, I've spotted the key point. Take another ten seconds to think if you like.","Don't get me wrong—I'm not praising you; this reasoning is just decent for once.","The most obvious answer is usually the one most worth questioning again.","...Fine, I'll admit this game is a little interesting, but don't get smug.","Ha! Don't think all I do is talk tough. I've already calculated a second route.","That move is bold, but boldness still needs one more step of verification to become smart.","Stop staring at my cards; check your own reasoning for holes first.","All right, your choice really did surprise me this time.","I can admit you calculated well, but don't expect me to praise you twice.","Someone usually spots the obvious flaw, so find another one.","Losing a round is nothing; repeating the same mistake is what gets interesting.","You can gamble on luck, but at least calculate what you're gambling on.","I didn't say this route would definitely win—only that it's worth trying.","See? That little advantage from a moment ago has already flipped.","Don't trust intuition too much, but don't throw it away either. Use your judgment.","One more round. I promise I'll be tougher to beat this time.","If you think my guess is wrong, prove it with the next card.","The result is interesting, but I'm not ready to admit defeat yet.","Strategy means leaving surprises for the opponent and preparation for yourself.","Fine. Remember this move—don't assume you can repeat it next time."]}],j2=[jn,...ol],A2="./characters/deepseek.png";

    'Sound: On':'Sound','Sound: Off':'Sound','Fullscreen':'Full','Exit Fullscreen':'Exit',
    'Leave Game':'Leave','Touch Interaction':'Touch'
  };
  function shortLabel(key){
    if(!key) return '';
    if(short[key]) return short[key];
    for(var k in short){ if(key.indexOf(k)===0) return short[k]; }
    var s=key.split(/[·:：/(（]/)[0].replace(/\s+/g,' ').trim();
    if(!s) s=key;
    if(s.length>12) s=s.slice(0,12);
    return s;
  }
  function enhance(){
    document.querySelectorAll('button').forEach(function(btn){
      if(btn.id==='councils-language-toggle') return;
      var existing=btn.querySelector('.mobile-label');
      var text=(btn.textContent||'').replace(existing?existing.textContent:'','').replace(/\s+/g,' ').trim();
      var label=btn.getAttribute('aria-label')||btn.getAttribute('title')||'';
      if(!label && text && text!=='×') label=text;
      if(label && label!=='×' && !btn.getAttribute('aria-label')) btn.setAttribute('aria-label',label);
      if(label && label!=='×' && !btn.getAttribute('title')) btn.setAttribute('title',label);
      if(btn.classList.contains('pill') && !text){btn.classList.add('icon-only');
        var cap=shortLabel(btn.getAttribute('title')||label||text);
        if(!cap) return;
        btn.classList.add('mobile-labeled');
        var el=btn.querySelector('.mobile-label');
        if(!el){el=document.createElement('span');el.className='mobile-label';el.setAttribute('aria-hidden','true');btn.appendChild(el);}
        if(el.textContent!==cap) el.textContent=cap;
      }
    });
  }

  function schedule(){if(scheduled)return;scheduled=true;setTimeout(function(){scheduled=false;enhance();},120);}
  var mo=new MutationObserver(schedule);

})();</script><script id="upgrade-enhance">

    document.querySelectorAll("img:not([alt])").forEach(function (img) {

    });
  }
  document.addEventListener("DOMContentLoaded", decorate);
  setTimeout(decorate, 1200);
})();

</script>

<script id="councils-language-switch">
(function () {
  "use strict";
  var isEnglish = document.documentElement.lang === "en";
